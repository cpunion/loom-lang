[package]
name = "loom-codegen-llvm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
inkwell.workspace = true
loom-codegen-ir.workspace = true
loom-core.workspace = true
loom-mir.workspace = true
loom-runtime-abi.workspace = true
llvm-sys.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true

[build-dependencies]
sha2.workspace = true
toml.workspace = true

[dev-dependencies]
loom-driver.workspace = true
loom-interpreter.workspace = true

[lints.rust]
# LLVM's typed GEP builder is marked unsafe because callers must prove the
# pointee/index relationship. Keep unsafe denied crate-wide and permit it only
# on the audited helper that carries Loom's native-storage proof.
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
