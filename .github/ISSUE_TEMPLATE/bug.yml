name: Bug report
description: Report a reproducible compiler, runtime, toolchain, or documentation defect.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Remove credentials, tokens, private source, and personal data.
        Security issues belong in the private channel described by `SECURITY.md`.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: State the observed behavior and the behavior you expected.
    validations:
      required: true

  - type: textarea
    id: reproducer
    attributes:
      label: Minimal reproducer
      description: Include a complete minimal project or a public repository and exact commands.
      render: shell
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics or output
      description: Paste unedited output after removing sensitive data.
      render: text
    validations:
      required: true

  - type: input
    id: loom_version
    attributes:
      label: Loom version or commit
      placeholder: loomc 0.1.0 or a full commit SHA
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Host OS/architecture, target triple, Rust version, and LLVM version.
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - LLVM native
        - Interpreter
        - Both
        - Frontend only
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Public-report checks
      options:
        - label: I searched existing issues and removed all secrets and private data.
          required: true

