name: Benchmark Comment

on:
  workflow_run:
    workflows: [PR Benchmarks]
    types: [completed]

permissions: {}

jobs:
  comment:
    name: Publish benchmark comparison
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      # workflow_run has a write-capable token. Load the renderer only from the
      # trusted default branch and never execute PR-controlled artifacts.
      - name: Check out trusted reporter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download benchmark evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-benchmark-${{ github.event.workflow_run.id }}
          path: benchmark-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate and render comparison
        env:
          BENCHMARK_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          node .github/scripts/render-benchmark-comment.mjs
          --base benchmark-evidence/benchmark-base.json
          --candidate benchmark-evidence/benchmark-candidate.json
          --sha "$BENCHMARK_HEAD_SHA"
          --output benchmark-comment.md

      - name: Create or update PR comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          number: ${{ github.event.workflow_run.pull_requests[0].number }}
          header: loom-cross-language-benchmark
          path: benchmark-comment.md
          skip_unchanged: true

