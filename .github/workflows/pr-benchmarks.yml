name: PR Benchmarks
run-name: PR Benchmarks (${{ (github.event.action != 'labeled' || github.event.label.name == 'benchmark') && contains(github.event.pull_request.labels.*.name, 'benchmark') && 'enabled' || 'disabled' }})

on:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  compare:
    name: Compare base and candidate (macOS arm64)
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'benchmark') &&
      contains(github.event.pull_request.labels.*.name, 'benchmark')
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Check out candidate merge revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          path: candidate
          persist-credentials: false

      - name: Install LLVM 19 on macOS
        run: |
          brew install llvm@19
          llvm_prefix="$(brew --prefix llvm@19)"
          {
            echo "LLVM_SYS_191_PREFIX=$llvm_prefix"
            echo "LOOM_CC=$llvm_prefix/bin/clang"
            echo "LOOM_BENCH_CC=$llvm_prefix/bin/clang"
            echo "LOOM_BENCH_CXX=$llvm_prefix/bin/clang++"
          } >> "$GITHUB_ENV"
          echo "$llvm_prefix/bin" >> "$GITHUB_PATH"

      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0

      - name: Install Go 1.27.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          cache: false

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            base -> target
            candidate -> target
          cache-targets: false
          key: pr-benchmark-macos-aarch64-llvm-19
          env-vars: LLVM_SYS_191_PREFIX

      - name: Verify pinned toolchains
        env:
          EXPECTED_RUST_HOST: aarch64-apple-darwin
        shell: bash
        run: |
          test "$(rustc --version)" = "rustc 1.88.0 (6b00bc388 2025-06-23)"
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$EXPECTED_RUST_HOST"
          case "$("$LLVM_SYS_191_PREFIX/bin/llvm-config" --version)" in
            19.*) ;;
            *) exit 1 ;;
          esac
          test "$(go version | awk '{print $3}')" = "go1.27.0"

      - name: Build and benchmark base
        working-directory: base
        shell: bash
        run: |
          CARGO_ENCODED_RUSTFLAGS='-Ctarget-cpu=generic' cargo build --release --locked -p loom-runtime
          cargo build --release --locked -p loom-cli -p loom-benchmark
          runtime_bundle="$(mktemp -d "$RUNNER_TEMP/loom-runtime-base.XXXXXX")/runtime"
          if target/release/loomc runtime pack \
            --archive target/release/libloom_runtime.a \
            --output "$runtime_bundle"; then
            export LOOM_RUNTIME_BUNDLE="$runtime_bundle"
          fi
          target/release/loom-benchmark \
            --throughput \
            --allow-busy-host \
            --output ../benchmark-base.json \
            >/dev/null

      - name: Build and benchmark candidate
        working-directory: candidate
        shell: bash
        run: |
          CARGO_ENCODED_RUSTFLAGS='-Ctarget-cpu=generic' cargo build --release --locked -p loom-runtime
          cargo build --release --locked -p loom-cli -p loom-benchmark
          runtime_bundle="$(mktemp -d "$RUNNER_TEMP/loom-runtime-candidate.XXXXXX")/runtime"
          target/release/loomc runtime pack \
            --archive target/release/libloom_runtime.a \
            --output "$runtime_bundle"
          export LOOM_RUNTIME_BUNDLE="$runtime_bundle"
          target/release/loom-benchmark \
            --throughput \
            --allow-busy-host \
            --output ../benchmark-candidate.json \
            >/dev/null

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-benchmark-${{ github.run_id }}-macos-aarch64
          path: |
            benchmark-base.json
            benchmark-candidate.json
          if-no-files-found: error
          retention-days: 14
