name: PR Benchmarks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  compare:
    name: Compare base and candidate (${{ matrix.platform }})
    if: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            rust_host: x86_64-unknown-linux-gnu
          - platform: macos-aarch64
            runner: macos-15
            rust_host: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Check out candidate merge revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          path: candidate
          persist-credentials: false

      - name: Install LLVM 19 on Linux
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-19 llvm-19-dev libpolly-19-dev
          {
            echo "LLVM_SYS_191_PREFIX=/usr/lib/llvm-19"
            echo "LOOM_CC=clang-19"
            echo "LOOM_BENCH_CC=clang-19"
            echo "LOOM_BENCH_CXX=clang++-19"
          } >> "$GITHUB_ENV"

      - name: Install LLVM 19 on macOS
        if: ${{ runner.os == 'macOS' }}
        run: |
          brew install llvm@19
          llvm_prefix="$(brew --prefix llvm@19)"
          {
            echo "LLVM_SYS_191_PREFIX=$llvm_prefix"
            echo "LOOM_CC=$llvm_prefix/bin/clang"
            echo "LOOM_BENCH_CC=$llvm_prefix/bin/clang"
            echo "LOOM_BENCH_CXX=$llvm_prefix/bin/clang++"
          } >> "$GITHUB_ENV"
          echo "$llvm_prefix/bin" >> "$GITHUB_PATH"

      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0

      - name: Install Go 1.27.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          cache: false

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            base -> target
            candidate -> target
          cache-targets: false
          key: pr-benchmark-${{ matrix.platform }}-llvm-19
          env-vars: LLVM_SYS_191_PREFIX

      - name: Verify pinned toolchains
        env:
          EXPECTED_RUST_HOST: ${{ matrix.rust_host }}
        shell: bash
        run: |
          test "$(rustc --version)" = "rustc 1.88.0 (6b00bc388 2025-06-23)"
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$EXPECTED_RUST_HOST"
          case "$("$LLVM_SYS_191_PREFIX/bin/llvm-config" --version)" in
            19.*) ;;
            *) exit 1 ;;
          esac
          test "$(go version | awk '{print $3}')" = "go1.27.0"

      - name: Build and benchmark base
        working-directory: base
        shell: bash
        run: |
          CARGO_ENCODED_RUSTFLAGS='-Ctarget-cpu=generic' cargo build --release --locked -p loom-runtime
          cargo build --release --locked -p loom-cli -p loom-benchmark
          if target/release/loomc runtime pack \
            --archive target/release/libloom_runtime.a \
            --output target/release/runtime; then
            export LOOM_RUNTIME_BUNDLE="$PWD/target/release/runtime"
          fi
          target/release/loom-benchmark \
            --throughput \
            --allow-busy-host \
            --output ../benchmark-base.json \
            >/dev/null

      - name: Build and benchmark candidate
        working-directory: candidate
        shell: bash
        run: |
          CARGO_ENCODED_RUSTFLAGS='-Ctarget-cpu=generic' cargo build --release --locked -p loom-runtime
          cargo build --release --locked -p loom-cli -p loom-benchmark
          target/release/loomc runtime pack \
            --archive target/release/libloom_runtime.a \
            --output target/release/runtime
          export LOOM_RUNTIME_BUNDLE="$PWD/target/release/runtime"
          target/release/loom-benchmark \
            --throughput \
            --allow-busy-host \
            --output ../benchmark-candidate.json \
            >/dev/null

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-benchmark-${{ github.run_id }}-${{ matrix.platform }}
          path: |
            benchmark-base.json
            benchmark-candidate.json
          if-no-files-found: error
          retention-days: 14
