name: compiler-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos-llvm19:
    name: macOS native compiler (LLVM 19)
    runs-on: macos-15
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Cold bootstrap resolves the pinned seed from Git history.

      - name: Check documentation
        run: |
          node --test .github/scripts/check-docs.test.mjs
          node .github/scripts/check-docs.mjs

      - name: Install LLVM 19
        run: |
          brew install llvm@19
          llvm_prefix="$(brew --prefix llvm@19)"
          echo "LLVM_SYS_191_PREFIX=$llvm_prefix" >> "$GITHUB_ENV"
          echo "LOOM_CC=$llvm_prefix/bin/clang" >> "$GITHUB_ENV"
          echo "$llvm_prefix/bin" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format, lint, and test
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          bash scripts/bootstrap.sh
          cargo test --locked --workspace

      - name: Export checked compiler for the Windows bootstrap
        run: target/loom emit-checked compiler/loom > target/compiler.checked

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checked-compiler
          path: target/compiler.checked
          if-no-files-found: error
          retention-days: 7

  linux-llvm19:
    name: Linux native compiler (LLVM 19)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      LLVM_SYS_191_PREFIX: /usr/lib/llvm-19
      LOOM_CC: /usr/bin/clang-19
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install LLVM development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-19-dev clang-19 libpolly-19-dev

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Bootstrap and full native gate
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          bash scripts/bootstrap.sh
          cargo test --locked --workspace

  windows-llvm19:
    name: Windows native compiler (LLVM 19)
    needs: macos-llvm19
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Select the MSVC linker for Rust
        shell: pwsh
        run: |
          # Git Bash also provides link.exe; Cargo must use the native linker.
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$env:VCToolsInstallDir/bin/Hostx64/x64/link.exe" >> $env:GITHUB_ENV

      - name: Install the LLVM development archive
        shell: pwsh
        timeout-minutes: 10
        run: |
          $archive = "$env:RUNNER_TEMP/llvm-dev.tar.xz"
          curl.exe -fL --retry 3 -o $archive 'https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.7/clang%2Bllvm-19.1.7-x86_64-pc-windows-msvc.tar.xz'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Windows tar stalled on this xz archive. Decode both archive layers
          # explicitly with 7-Zip; a single extraction only produces the tar.
          $expanded = "$env:RUNNER_TEMP/llvm-expanded"
          $sevenZip = "$env:ProgramFiles/7-Zip/7z.exe"
          & $sevenZip x $archive "-o$expanded" -y -bsp0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $sevenZip x "$expanded/llvm-dev.tar" "-o$expanded/tree" -y -bsp0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item "$expanded/tree/clang+llvm-19.1.7-x86_64-pc-windows-msvc" C:/llvm-19
          'LLVM_PATH=C:/llvm-19' >> $env:GITHUB_ENV
          'C:/llvm-19/bin' >> $env:GITHUB_PATH

      - name: Complete the LLVM development package
        shell: pwsh
        run: |
          # The official archive has llvm-config and LLVM libraries, but omits
          # its advertised libxml2s.lib. Supply the real static library, no stub.
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install 'libxml2[core]:x64-windows-static-md'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md/lib/libxml2.lib" "$env:LLVM_PATH/lib/libxml2s.lib"
          "LLVM_SYS_191_PREFIX=$env:LLVM_PATH" >> $env:GITHUB_ENV
          "LOOM_CC=$env:LLVM_PATH/bin/clang-cl.exe" >> $env:GITHUB_ENV
          & "$env:LLVM_PATH/bin/llvm-config.exe" --version --system-libs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: checked-compiler
          path: target/bootstrap-input

      - name: Native bootstrap and full gate
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          LOOM_BOOTSTRAP_INPUT=target/bootstrap-input/compiler.checked bash scripts/bootstrap.sh
          cargo test --locked --workspace
