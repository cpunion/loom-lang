name: compiler-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos-llvm22:
    name: macOS native compiler (LLVM 22)
    runs-on: macos-15
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Cold bootstrap resolves the pinned seed from Git history.

      - name: Check documentation
        run: |
          node --test .github/scripts/check-docs.test.mjs
          node .github/scripts/check-docs.mjs

      - name: Install LLVM 22
        run: |
          brew install llvm@22
          llvm_prefix="$(brew --prefix llvm@22)"
          echo "LLVM_SYS_221_PREFIX=$llvm_prefix" >> "$GITHUB_ENV"
          echo "LOOM_CC=$llvm_prefix/bin/clang" >> "$GITHUB_ENV"
          echo "$llvm_prefix/bin" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format, lint, and test
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          bash scripts/bootstrap.sh
          cargo test --locked --workspace

      - name: Export checked compiler for the Windows bootstrap
        run: target/loom emit-checked compiler/loom > target/compiler.checked

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checked-compiler
          path: target/compiler.checked
          if-no-files-found: error
          retention-days: 7

  linux-llvm22:
    name: Linux native compiler (LLVM 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      LLVM_SYS_221_PREFIX: /usr/lib/llvm-22
      LOOM_CC: /usr/bin/clang-22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install LLVM development libraries
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o "$RUNNER_TEMP/llvm-snapshot.asc"
          sudo install -m 644 "$RUNNER_TEMP/llvm-snapshot.asc" /usr/share/keyrings/llvm-snapshot.asc
          echo 'deb [signed-by=/usr/share/keyrings/llvm-snapshot.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' |
            sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev clang-22 libpolly-22-dev
          llvm-config-22 --version --system-libs

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Bootstrap and full native gate
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          bash scripts/bootstrap.sh
          cargo test --locked --workspace

  windows-llvm22:
    name: Windows native compiler (LLVM 22)
    needs: macos-llvm22
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Install the LLVM development archive
        shell: pwsh
        timeout-minutes: 10
        run: |
          $archive = "$env:RUNNER_TEMP/llvm-dev.tar.xz"
          curl.exe -fL --retry 3 -o $archive 'https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/clang%2Bllvm-22.1.8-x86_64-pc-windows-msvc.tar.xz'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'd96c2cc1736f4eb7fa43cb9bbdf56d93551a9ae0a9aadb9c99c3c3b2b712a234') {
            throw 'LLVM 22.1.8 development archive checksum mismatch'
          }
          # Windows tar stalled on this xz archive. Decode both archive layers
          # explicitly with 7-Zip; a single extraction only produces the tar.
          $expanded = "$env:RUNNER_TEMP/llvm-expanded"
          $sevenZip = "$env:ProgramFiles/7-Zip/7z.exe"
          & $sevenZip x $archive "-o$expanded" -y -bsp0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $sevenZip x "$expanded/llvm-dev.tar" "-o$expanded/tree" -y -bsp0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item "$expanded/tree/clang+llvm-22.1.8-x86_64-pc-windows-msvc" C:/llvm-22
          'LLVM_PATH=C:/llvm-22' >> $env:GITHUB_ENV
          'C:/llvm-22/bin' >> $env:GITHUB_PATH

      - name: Complete the LLVM development package
        shell: pwsh
        run: |
          $systemLibraries = & "$env:LLVM_PATH/bin/llvm-config.exe" --link-static --system-libs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $systemLibraries
          # Complete an advertised but missing dependency with a real library.
          if ($systemLibraries -match 'libxml2s' -and !(Test-Path "$env:LLVM_PATH/lib/libxml2s.lib")) {
            & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install 'libxml2[core]:x64-windows-static-md'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md/lib/libxml2.lib" "$env:LLVM_PATH/lib/libxml2s.lib"
          }
          "LLVM_SYS_221_PREFIX=$env:LLVM_PATH" >> $env:GITHUB_ENV
          "LOOM_CC=$env:LLVM_PATH/bin/clang-cl.exe" >> $env:GITHUB_ENV
          & "$env:LLVM_PATH/bin/llvm-config.exe" --version --link-static --system-libs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: checked-compiler
          path: target/bootstrap-input

      - name: Native bootstrap and full gate
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          LOOM_BOOTSTRAP_INPUT=target/bootstrap-input/compiler.checked bash scripts/bootstrap.sh
          cargo test --locked --workspace
