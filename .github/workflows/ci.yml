name: compiler-ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: compiler-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-llvm19:
    runs-on: ubuntu-24.04
    env:
      LLVM_SYS_191_PREFIX: /usr/lib/llvm-19
      LOOM_CC: clang-19
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install LLVM 19
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-19 llvm-19-dev libpolly-19-dev
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --all-targets
      - name: Core 0.1-0.3 dual-backend closure
        run: |
          for version in core01 core02 core03; do
            source="examples/$version"
            native="target/ci-$version"
            interpreted="target/ci-$version.loomi"
            cargo run -p loom-cli -- --no-cache check "$source"
            cargo run -p loom-cli -- --no-cache build --output "$native" "$source"
            cargo run -p loom-cli -- --no-cache test "$source"
            cargo run -p loom-cli -- --no-cache run "$source"
            cargo run -p loom-cli -- run --artifact "$native"
            cargo run -p loom-cli -- --backend interpreter --no-cache check "$source"
            cargo run -p loom-cli -- --backend interpreter --no-cache build --output "$interpreted" "$source"
            cargo run -p loom-cli -- --backend interpreter --no-cache test "$source"
            cargo run -p loom-cli -- --backend interpreter --no-cache run "$source"
            cargo run -p loom-cli -- --backend interpreter run --artifact "$interpreted"
          done
      - name: Package targets on both backends
        run: |
          cargo run -p loom-cli -- --no-cache check --target app examples/packages/application
          cargo run -p loom-cli -- --no-cache build --target app --output target/ci-package examples/packages/application
          cargo run -p loom-cli -- --no-cache test --target unit examples/packages/application
          cargo run -p loom-cli -- --no-cache run --target app examples/packages/application
          cargo run -p loom-cli -- run --artifact target/ci-package
          cargo run -p loom-cli -- --backend interpreter --no-cache check --target app examples/packages/application
          cargo run -p loom-cli -- --backend interpreter --no-cache build --target app --output target/ci-package.loomi examples/packages/application
          cargo run -p loom-cli -- --backend interpreter --no-cache test --target unit examples/packages/application
          cargo run -p loom-cli -- --backend interpreter --no-cache run --target app examples/packages/application
          cargo run -p loom-cli -- --backend interpreter run --artifact target/ci-package.loomi
      - name: C3 repository check/build/test/run on both backends
        run: |
          cargo run -p loom-cli -- --no-cache check --target app examples/c3/application
          cargo run -p loom-cli -- --no-cache build --target app --output target/ci-c3 examples/c3/application
          cargo run -p loom-cli -- --no-cache test --target unit examples/c3/application
          cargo run -p loom-cli -- --no-cache run --target app examples/c3/application
          cargo run -p loom-cli -- run --artifact target/ci-c3
          cargo run -p loom-cli -- --backend interpreter --no-cache check --target app examples/c3/application
          cargo run -p loom-cli -- --backend interpreter --no-cache build --target app --output target/ci-c3.loomi examples/c3/application
          cargo run -p loom-cli -- --backend interpreter --no-cache test --target unit examples/c3/application
          cargo run -p loom-cli -- --backend interpreter --no-cache run --target app examples/c3/application
          cargo run -p loom-cli -- --backend interpreter run --artifact target/ci-c3.loomi
      - name: Verify embedded Linux DWARF
        run: |
          llvm-dwarfdump-19 --debug-info target/ci-core01 | grep 'DW_AT_producer.*loomc'
          llvm-dwarfdump-19 --debug-line target/ci-core01 | grep 'shop.loom'
      - name: C3 controlled correctness and performance gates
        run: cargo run --release -p loom-quality | tee target/c3-evidence.json
      - name: Upload C3 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: c3-evidence-linux-llvm19
          path: target/c3-evidence.json
          if-no-files-found: error

  fuzz-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz -> target
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.1
      - name: Fuzz lossless syntax and recovery
        run: cargo +nightly fuzz run syntax -- -max_total_time=20 -timeout=5 -rss_limit_mb=2048
      - name: Fuzz artifact decoding and MIR validation
        run: cargo +nightly fuzz run artifact -- -max_total_time=20 -timeout=5 -rss_limit_mb=2048
      - name: Fuzz proof and runtime-check semantics
        run: cargo +nightly fuzz run semantics -- -max_total_time=20 -timeout=5 -rss_limit_mb=2048

  macos-llvm19:
    runs-on: macos-14
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install and discover LLVM 19
        run: |
          brew install llvm@19
          llvm_prefix="$(brew --prefix llvm@19)"
          echo "LLVM_SYS_191_PREFIX=$llvm_prefix" >> "$GITHUB_ENV"
          echo "LOOM_CC=$llvm_prefix/bin/clang" >> "$GITHUB_ENV"
          echo "$llvm_prefix/bin" >> "$GITHUB_PATH"
          "$llvm_prefix/bin/llvm-config" --version
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check and test workspace
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-targets
          cargo test --workspace --all-targets
      - name: C3 repository check/build/test/run on both backends
        run: |
          cargo run -p loom-cli -- --no-cache check --target app examples/c3/application
          cargo run -p loom-cli -- --no-cache build --target app --output target/ci-c3 examples/c3/application
          cargo run -p loom-cli -- --no-cache test --target unit examples/c3/application
          cargo run -p loom-cli -- --no-cache run --target app examples/c3/application
          cargo run -p loom-cli -- run --artifact target/ci-c3
          cargo run -p loom-cli -- --backend interpreter --no-cache check --target app examples/c3/application
          cargo run -p loom-cli -- --backend interpreter --no-cache build --target app --output target/ci-c3.loomi examples/c3/application
          cargo run -p loom-cli -- --backend interpreter --no-cache test --target unit examples/c3/application
          cargo run -p loom-cli -- --backend interpreter --no-cache run --target app examples/c3/application
          cargo run -p loom-cli -- --backend interpreter run --artifact target/ci-c3.loomi
