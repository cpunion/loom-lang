name: compiler-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos-llvm19:
    name: macOS development gate (LLVM 19)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check repository documentation and workflow policy
        run: |
          node --test .github/scripts/*.test.mjs
          node .github/scripts/check-docs.mjs

      - name: Install and discover LLVM 19
        run: |
          brew install llvm@19
          llvm_prefix="$(brew --prefix llvm@19)"
          echo "LLVM_SYS_191_PREFIX=$llvm_prefix" >> "$GITHUB_ENV"
          echo "LOOM_CC=$llvm_prefix/bin/clang" >> "$GITHUB_ENV"
          echo "$llvm_prefix/bin" >> "$GITHUB_PATH"
          "$llvm_prefix/bin/llvm-config" --version

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format and lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Prepare the host runtime sidecar
        run: |
          CARGO_ENCODED_RUSTFLAGS='-Ctarget-cpu=generic' cargo build --locked -p loom-runtime
          cargo build --locked -p loom-cli
          runtime_bundle="$PWD/target/runtime-sidecar-$GITHUB_JOB-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          target/debug/loomc runtime pack \
            --archive target/debug/libloom_runtime.a \
            --output "$runtime_bundle"
          echo "LOOM_RUNTIME_BUNDLE=$runtime_bundle" >> "$GITHUB_ENV"

      - name: Test workspace
        run: cargo test --locked --workspace --all-targets

      - name: Test the standard library with both backends
        run: |
          target/debug/loomc --no-cache test library/std/tests
          target/debug/loomc --backend interpreter --no-cache test library/std/tests
