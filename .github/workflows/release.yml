name: release-binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  archive:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select and validate release identity
        id: release
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ "$RELEASE_EVENT" = "workflow_dispatch" ]; then
            echo "name=manual-$RELEASE_RUN_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          workspace_version="$(
            awk '
              /^\[workspace.package\]$/ { in_package = 1; next }
              in_package && /^\[/ { exit }
              in_package && /^version = "/ {
                sub(/^version = "/, "")
                sub(/"$/, "")
                print
                exit
              }
            ' Cargo.toml
          )"
          if [ -z "$workspace_version" ]; then
            echo "Cannot read the workspace package version from Cargo.toml" >&2
            exit 1
          fi
          if [ "$RELEASE_TAG" != "v$workspace_version" ]; then
            echo "Release tag $RELEASE_TAG must equal v$workspace_version" >&2
            exit 1
          fi
          echo "name=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Install LLVM 19 on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-19 llvm-19-dev libpolly-19-dev
          echo "LLVM_SYS_191_PREFIX=/usr/lib/llvm-19" >> "$GITHUB_ENV"
          echo "LOOM_CC=clang-19" >> "$GITHUB_ENV"
      - name: Install and discover LLVM 19 on macOS
        if: runner.os == 'macOS'
        run: |
          brew install llvm@19
          llvm_prefix="$(brew --prefix llvm@19)"
          echo "LLVM_SYS_191_PREFIX=$llvm_prefix" >> "$GITHUB_ENV"
          echo "LOOM_CC=$llvm_prefix/bin/clang" >> "$GITHUB_ENV"
          echo "$llvm_prefix/bin" >> "$GITHUB_PATH"
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build portable release runtime archive
        run: CARGO_ENCODED_RUSTFLAGS='-Ctarget-cpu=generic' cargo build --locked --release -p loom-runtime
      - name: Build release tools
        run: cargo build --locked --release -p loom-cli -p loom-lsp
      - name: Pack adjacent release runtime sidecar
        run: |
          target/release/loomc runtime pack \
            --archive target/release/libloom_runtime.a \
            --output target/release/runtime
      - name: C3 dual-backend release gate
        run: |
          cargo run --locked --release -p loom-cli -- --no-cache check --target app examples/c3/application
          cargo run --locked --release -p loom-cli -- --no-cache build --target app --output target/release-c3 examples/c3/application
          cargo run --locked --release -p loom-cli -- --no-cache test --target unit examples/c3/application
          cargo run --locked --release -p loom-cli -- --no-cache run --target app examples/c3/application
          cargo run --locked --release -p loom-cli -- --backend interpreter --no-cache check --target app examples/c3/application
          cargo run --locked --release -p loom-cli -- --backend interpreter --no-cache build --target app --output target/release-c3.loomi examples/c3/application
          cargo run --locked --release -p loom-cli -- --backend interpreter --no-cache test --target unit examples/c3/application
          cargo run --locked --release -p loom-cli -- --backend interpreter --no-cache run --target app examples/c3/application
      - name: Portable package artifact release gate
        run: cargo test --locked --release -p loom-cli --test cli library_targets_build_portable_validated_artifacts
      - name: Standard library differential release gate
        run: |
          cargo test --locked --release -p loom-codegen-llvm --test structured_standard_values
          cargo test --locked --release -p loom-codegen-llvm --test runtime_bundle
      - name: Controlled quality release gate
        run: cargo run --locked --release -p loom-quality > target/c3-evidence.json
      - name: Verify release tools
        run: |
          target/release/loomc --help
          target/release/loom-lsp --help || test "$?" -eq 2
      - name: Archive and checksum
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_NAME: ${{ steps.release.outputs.name }}
        run: |
          archive="loom-lang-${RELEASE_NAME}-${RELEASE_PLATFORM}.tar.gz"
          staging="target/release-package"
          mkdir -p "$staging"
          cp target/release/loomc target/release/loom-lsp "$staging/"
          cp \
            README.md LICENSE CHANGELOG.md ROADMAP.md \
            CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md GOVERNANCE.md SUPPORT.md \
            "$staging/"
          cp -R docs "$staging/docs"
          cp -R target/release/runtime "$staging/runtime"
          "$staging/loomc" --no-cache build --output target/release-bundle-smoke examples/core01
          target/release-bundle-smoke
          tar -czf "$archive" -C "$staging" .
          shasum -a 256 "$archive" > "$archive.sha256"
      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: loom-lang-${{ steps.release.outputs.name }}-${{ matrix.platform }}
          path: |
            loom-lang-*.tar.gz
            loom-lang-*.tar.gz.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: archive
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download platform archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: loom-lang-${{ github.ref_name }}-*
          path: dist
          merge-multiple: true
      - name: Verify and aggregate checksums
        run: |
          cd dist
          for checksum in loom-lang-*.tar.gz.sha256; do
            shasum -a 256 --check "$checksum"
          done
          LC_ALL=C sort loom-lang-*.tar.gz.sha256 > SHA256SUMS
      - name: Publish immutable GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi

          existing_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          for asset in \
            dist/loom-lang-*.tar.gz \
            dist/loom-lang-*.tar.gz.sha256 \
            dist/SHA256SUMS
          do
            asset_name="${asset##*/}"
            if printf '%s\n' "$existing_assets" | grep -Fqx "$asset_name"; then
              echo "Release asset $asset_name already exists; refusing to replace it" >&2
              exit 1
            fi
          done

          gh release upload "$RELEASE_TAG" \
            dist/loom-lang-*.tar.gz \
            dist/loom-lang-*.tar.gz.sha256 \
            dist/SHA256SUMS
