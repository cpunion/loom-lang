name: release-binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  archive:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: macos-14
            platform: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install LLVM 19 on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-19 llvm-19-dev libpolly-19-dev
          echo "LLVM_SYS_191_PREFIX=/usr/lib/llvm-19" >> "$GITHUB_ENV"
          echo "LOOM_CC=clang-19" >> "$GITHUB_ENV"
      - name: Install and discover LLVM 19 on macOS
        if: runner.os == 'macOS'
        run: |
          brew install llvm@19
          llvm_prefix="$(brew --prefix llvm@19)"
          echo "LLVM_SYS_191_PREFIX=$llvm_prefix" >> "$GITHUB_ENV"
          echo "LOOM_CC=$llvm_prefix/bin/clang" >> "$GITHUB_ENV"
          echo "$llvm_prefix/bin" >> "$GITHUB_PATH"
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build release tools
        run: cargo build --locked --release -p loom-cli -p loom-lsp
      - name: C3 dual-backend release gate
        run: |
          cargo run --locked --release -p loom-cli -- --no-cache check --target app examples/c3/application
          cargo run --locked --release -p loom-cli -- --no-cache build --target app --output target/release-c3 examples/c3/application
          cargo run --locked --release -p loom-cli -- --no-cache test --target unit examples/c3/application
          cargo run --locked --release -p loom-cli -- --no-cache run --target app examples/c3/application
          cargo run --locked --release -p loom-cli -- --backend interpreter --no-cache check --target app examples/c3/application
          cargo run --locked --release -p loom-cli -- --backend interpreter --no-cache build --target app --output target/release-c3.loomi examples/c3/application
          cargo run --locked --release -p loom-cli -- --backend interpreter --no-cache test --target unit examples/c3/application
          cargo run --locked --release -p loom-cli -- --backend interpreter --no-cache run --target app examples/c3/application
      - name: Portable package artifact release gate
        run: cargo test --locked --release -p loom-cli --test cli library_targets_build_portable_validated_artifacts
      - name: Standard library differential release gate
        run: |
          cargo test --locked --release -p loom-codegen-llvm --test structured_standard_values
          cargo test --locked --release -p loom-codegen-llvm --test runtime_bundle
      - name: Controlled quality release gate
        run: cargo run --locked --release -p loom-quality > target/c3-evidence.json
      - name: Verify release tools
        run: |
          target/release/loomc --help
          target/release/loom-lsp --help || test "$?" -eq 2
      - name: Export and verify host runtime bundle
        run: |
          target/release/loomc runtime export --output target/release-runtime
          target/release/loomc --runtime-bundle target/release-runtime --linker "$LOOM_CC" build --output target/release-bundle-smoke examples/core01
          target/release-bundle-smoke
      - name: Archive and checksum
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          version="${RELEASE_REF:-manual}"
          archive="loom-lang-${version}-${RELEASE_PLATFORM}.tar.gz"
          staging="target/release-package"
          mkdir -p "$staging"
          cp target/release/loomc target/release/loom-lsp README.md "$staging/"
          cp -R target/release-runtime "$staging/runtime"
          tar -czf "$archive" -C "$staging" .
          shasum -a 256 "$archive" > "$archive.sha256"
      - name: Upload release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: loom-lang-${{ github.ref_name }}-${{ matrix.platform }}
          path: |
            loom-lang-*.tar.gz
            loom-lang-*.tar.gz.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: archive
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download platform archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: loom-lang-${{ github.ref_name }}-*
          path: dist
          merge-multiple: true
      - name: Verify and aggregate checksums
        run: |
          cd dist
          for checksum in loom-lang-*.tar.gz.sha256; do
            shasum -a 256 --check "$checksum"
          done
          LC_ALL=C sort loom-lang-*.tar.gz.sha256 > SHA256SUMS
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" \
            dist/loom-lang-*.tar.gz \
            dist/loom-lang-*.tar.gz.sha256 \
            dist/SHA256SUMS \
            --clobber
