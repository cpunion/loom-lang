name: documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test documentation policy checker
        run: node --test .github/scripts/check-docs.test.mjs

      - name: Test release workflow policy
        run: node --test .github/scripts/check-release-workflow.test.mjs

      - name: Check documentation structure, language, and local links
        run: node .github/scripts/check-docs.mjs

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

      - name: Check links and fragments offline
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline
            --root-dir ${{ github.workspace }}
            --no-progress
            './**/*.md'
          fail: true
          failIfEmpty: true

      - name: Check documentation spelling
        uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # v1.49.0
        with:
          files: "./**/*.md"
