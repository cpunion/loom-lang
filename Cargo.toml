[workspace]
resolver = "2"
members = [
    "crates/loom-core",
    "crates/loom-syntax",
    "crates/loom-hir",
    "crates/loom-sema",
    "crates/loom-mir",
    "crates/loom-codegen-ir",
    "crates/loom-lowering",
    "crates/loom-interpreter",
    "crates/loom-runtime-abi",
    "crates/loom-runtime",
    "crates/loom-codegen-llvm",
    "crates/loom-driver",
    "crates/loom-cli",
    "crates/loom-lsp",
    "crates/loom-quality",
    "crates/loom-benchmark",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/cpunion/loom-lang"
rust-version = "1.88"

[workspace.dependencies]
loom-core = { path = "crates/loom-core" }
loom-syntax = { path = "crates/loom-syntax" }
loom-hir = { path = "crates/loom-hir" }
loom-sema = { path = "crates/loom-sema" }
loom-mir = { path = "crates/loom-mir" }
loom-codegen-ir = { path = "crates/loom-codegen-ir" }
loom-lowering = { path = "crates/loom-lowering" }
loom-interpreter = { path = "crates/loom-interpreter" }
loom-runtime-abi = { path = "crates/loom-runtime-abi" }
loom-runtime = { path = "crates/loom-runtime" }
loom-codegen-llvm = { path = "crates/loom-codegen-llvm" }
loom-driver = { path = "crates/loom-driver" }
inkwell = { version = "0.10.0", default-features = false }
libc = "0.2"
llvm-sys = { version = "191.1.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
unicode-ident = "1.0"
polling = "3.11"
same-file = "1.0.6"
semver = "1.0"
sha2 = "0.10"
toml = "0.9"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
wait-timeout = "0.2.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
