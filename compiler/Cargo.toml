[package]
name = "loom-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[dependencies]
inkwell = { version = "=0.10.0", default-features = false, features = ["llvm22-1-prefer-dynamic", "target-aarch64", "target-x86"] }
sha2 = "0.10"
tempfile = "3.20"
object = { version = "=0.37.3", default-features = false, features = ["read_core", "elf", "macho", "coff", "std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(all(unix, target_arch = "aarch64"))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_LibraryLoader"] }

[lints.rust]
unsafe_code = "deny"

[dev-dependencies]
rustls.workspace = true
rustls-pemfile.workspace = true
rcgen.workspace = true

[lints.clippy]
all = "warn"
