[package]
name = "loom-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[dependencies]
inkwell = { version = "=0.10.0", default-features = false, features = ["llvm22-1-prefer-dynamic", "target-aarch64", "target-x86"] }
tempfile = "3.20"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
