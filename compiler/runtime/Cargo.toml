[package]
name = "loom-seed-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.20"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
